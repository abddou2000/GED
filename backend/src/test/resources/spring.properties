# Réglages de Spring lus au chargement (SpringProperties), pour la suite de tests seulement.
#
# Au plus 12 contextes de test en cache (32 par défaut) : chacun garde son pool de
# connexions ouvert. 12 contextes × 5 connexions (application-test.yml) + marge tiennent
# dans les 97 connexions du service postgres:16 de la CI (BudgetConnexionsSuiteTest).
# Au-delà, le contexte le moins récemment utilisé est fermé, et son pool avec lui.
spring.test.context.cache.maxSize=12
