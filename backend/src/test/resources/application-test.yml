# Profil de TEST — base H2 en mémoire, isolée (recréée à chaque exécution).
spring:
  # Liquibase n'est sur le classpath de test que pour appliquer les changesets
  # « a-integrer » du lot E6 à la base PostgreSQL de test (dev3). Le contexte
  # Spring de test reste sur H2 sans changelog maître : l'autoconfiguration
  # est coupée ici, jusqu'à l'intégration du socle Liquibase de dev1.
  liquibase:
    enabled: false
  # Flyway est desactive ici : le schema de developpement est cree par
  # `ddl-auto: update`, et les migrations sont ecrites en dialecte MySQL —
  # les appliquer a H2 echouerait. Elles ne concernent que la production.
  flyway:
    enabled: false
  datasource:
    url: jdbc:h2:mem:gedtest;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
  h2:
    console:
      enabled: false

# Stockage des fichiers en test : dossier build jetable
ged:
  storage:
    root: ./target/test-storage
    temp: ./target/test-temp

  # Stockage sécurisé : keystore jetable recréé sous target/. La phrase
  # secrète n'est pas un secret (même statut que la clé JWT de test ci-dessous).
  # L'antivirus pointe sur un port où rien n'écoute : les tests qui l'exercent
  # démarrent leur propre faux clamd et construisent leur client.
  fichiers:
    racine: ./target/test-coffre
    racine-cache-apercu: ./target/test-cache-apercu
    cles:
      keystore: ./target/test-cles/ged-kek.p12
      mot-de-passe: test-only-keystore-password
      creer-si-absent: true
    antivirus:
      port: 1
      delai-connexion-ms: 500
    previsualisation:
      repertoire-travail: ./target/test-apercu-travail

  securite:
    # Mot de passe d'amorçage des comptes de test.
    #
    # Ce n'est PAS un secret exposé : la base visée est H2 *en mémoire*
    # (jdbc:h2:mem:gedtest, ddl-auto: create-drop, cf. plus haut). Elle naît et
    # meurt avec la JVM de test, n'est jointe par aucun port, et aucun compte
    # produit ici ne survit à l'exécution. La valeur est volontairement
    # inutilisable ailleurs.
    #
    # Sans cette ligne, `mot-de-passe-initial` reste vide (application.yml,
    # fail-closed volontaire) : CompteSeeder ne crée AUCUN compte et les tests
    # ne peuvent plus s'authentifier — or l'API est désormais fermée par défaut
    # (anyRequest().authenticated()). Les tests doivent donc s'authentifier
    # comme un vrai client, pas contourner la sécurité.
    mot-de-passe-initial: test-only-password

    # Compte unique des tests. L'adresse correspond à l'employé 1 du jeu de
    # démonstration (Sara Bennani) : le seeder rattache donc le compte à cet
    # employé existant au lieu d'en créer un.
    email-admin: sara.bennani@marchica.ma

    # Clé JWT fixe pour les tests, afin que la clé aléatoire tirée au démarrage
    # hors prod ne rende pas les tests dépendants d'un tirage. Même statut que
    # ci-dessus : jetable, jamais chargée en prod (le profil prod n'a aucune
    # valeur par défaut et refuse de démarrer sans GED_JWT_CLE).
    jwt:
      cle: cle-de-test-uniquement-jamais-en-production-0123456789
