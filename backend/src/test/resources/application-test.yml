# Profil de TEST — PostgreSQL local, base dédiée aux tests.
#
# Base : ${DB_NAME}_test (ged_dev1_test par défaut), ou DB_NAME_TEST si défini.
# Le suffixe est voulu : la suite de tests VIDE son schéma au démarrage
# (drop-first ci-dessous) ; dériver son nom de celui de la base de
# développement empêche qu'une variable DB_NAME exportée pour le dev fasse
# effacer la base de dev par un `mvn test`.
#
# Prérequis (une fois) : backend/scripts/db/creer-roles.sql, puis
# backend/scripts/db/preparer-base.sql avec -v tests=oui.
ged:
  base:
    nom: ${DB_NAME_TEST:${DB_NAME:ged_dev1}_test}

  # Stockage sécurisé : keystore jetable recréé sous target/. La phrase
  # secrète n'est pas un secret (même statut que la clé JWT de test ci-dessous).
  # Antivirus neutralisé pour les tests d'API (aucun ClamAV sur le poste) ;
  # les tests qui l'exercent démarrent leur propre faux clamd (ClientClamdTest,
  # ControleFichiersTest, DepotAntivirusApiTest).
  fichiers:
    racine: ./target/test-coffre
    racine-cache-apercu: ./target/test-cache-apercu
    cles:
      keystore: ./target/test-cles/ged-kek.p12
      mot-de-passe: test-only-keystore-password
      creer-si-absent: true
    antivirus:
      actif: false
    integrite:
      verification-planifiee: false
    previsualisation:
      repertoire-travail: ./target/test-apercu-travail
  ocr:
    chaine:
      # Chaîne inactive par défaut dans les tests d'API (dépôt en 201) ; les
      # tests qui l'exercent l'activent (OcrApiTest, RechercheApiTest : 202, job
      # enfilé). Jamais de worker dans le contexte Spring de test : la chaîne
      # de traitement est testée à part (TravailleurOcrPostgresTest).
      actif: false
      workers: 0
  cycledevie:
    # Aucun travailleur de fond : les tests déclenchent eux-mêmes les jobs
    # (ArchivageDossiers.traiterUnJob, ExportDossiers.traiterUnJob).
    travailleur:
      actif: false
    archivage:
      repertoire-travail: ./target/test-conservation-travail

  # Identité : simulateur d'annuaire embarqué (UnboundID) chargé du LDIF de
  # test ; comptes à mot de passe « test-only-password », jetables, qui
  # n'existent que dans ce simulateur. Clé JWT : paire RSA tirée par exécution.
  identite:
    annuaire:
      urls: ldap://localhost:33390
      base: DC=marchicamed,DC=ma
      compte-service: CN=svc-ged-ldap,OU=Services,DC=marchicamed,DC=ma
      mot-de-passe-service: test-only-password
      exiger-ldaps: false
      pool: false
      embarque:
        port: 33390
        ldif: classpath:annuaire/annuaire-test.ldif
    jeton:
      cle-ephemere-autorisee: true
    amorcage:
      administrateurs: sbennani

spring:
  liquibase:
    # Schéma vidé puis entièrement recréé par Liquibase au démarrage de la
    # suite : chaque exécution part d'une base vierge, comme une installation
    # neuve, et prouve au passage que le changelog complet s'applique.
    drop-first: true
  jpa:
    show-sql: false
