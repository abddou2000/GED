# ============================================================
#  Profil DEV — PostgreSQL local, base ged_dev1 (surchargeable par DB_NAME)
#  Prérequis : backend/scripts/db/creer-roles.sql puis preparer-base.sql
#  Le schéma est créé par Liquibase au démarrage.
# ============================================================
spring:
  jpa:
    show-sql: true
    properties:
      hibernate:
        format_sql: true

logging:
  level:
    org.hibernate.SQL: DEBUG

# ============================================================
#  Amorçage local
# ============================================================
ged:
  base:
    nom: ${DB_NAME:ged_dev1}

  # Identité : annuaire de DÉMONSTRATION embarqué (UnboundID), démarré par le
  # profil dev sur ce poste. Comptes de démonstration (mot de passe
  # « dev-local-only », voir annuaire/annuaire-dev.ldif) : sbennani
  # (Administrateur par amorçage), kelfassi, yalaoui, nidrissi (sans rôle),
  # otazi (désactivé dans l'annuaire). Ces comptes n'existent QUE dans le
  # simulateur : le profil prod n'en connaît aucun et refuse l'annuaire embarqué.
  identite:
    annuaire:
      urls: ${GED_LDAP_URLS:ldap://localhost:33389}
      base: ${GED_LDAP_BASE:DC=marchicamed,DC=ma}
      compte-service: ${GED_LDAP_COMPTE_SERVICE:CN=svc-ged-ldap,OU=Services,DC=marchicamed,DC=ma}
      mot-de-passe-service: ${GED_LDAP_MOT_DE_PASSE:dev-local-only}
      exiger-ldaps: false
      embarque:
        port: 33389
        ldif: classpath:annuaire/annuaire-dev.ldif
    jeton:
      cle-ephemere-autorisee: true
    amorcage:
      administrateurs: ${GED_ADMINISTRATEURS:sbennani}

  # Stockage sécurisé : keystore local jetable, rangé HORS du dépôt git, dans
  # le profil de l'utilisateur. Un chemin relatif dépendait du répertoire de
  # lancement : démarrée depuis la racine du dépôt, l'application créait la
  # clé maîtresse dans un dossier que git ne savait pas ignorer (ANO-E5-001).
  # La phrase secrète par défaut n'est PAS un secret : elle ne protège que des
  # fichiers de démonstration sur ce poste. Sans ClamAV installé, l'antivirus
  # est neutralisé (interdit en prod, qui refuse alors de démarrer).
  fichiers:
    cles:
      keystore: ${GED_KEYSTORE_CHEMIN:${user.home}/.ged-dev/cles/ged-kek.p12}
      mot-de-passe: ${GED_KEYSTORE_MDP:dev-local-only}
      creer-si-absent: true
    antivirus:
      actif: ${GED_ANTIVIRUS_ACTIF:false}
