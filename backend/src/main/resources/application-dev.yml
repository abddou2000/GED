# ============================================================
#  Profil DEV — PostgreSQL local, base ged_dev1 (surchargeable par DB_NAME)
#  Prérequis : backend/scripts/db/creer-roles.sql puis preparer-base.sql
#  Le schéma est créé par Liquibase au démarrage.
# ============================================================
spring:
  jpa:
    show-sql: true
    properties:
      hibernate:
        format_sql: true

logging:
  level:
    org.hibernate.SQL: DEBUG

# ============================================================
#  Amorçage local
# ============================================================
ged:
  base:
    nom: ${DB_NAME:ged_dev1}

  securite:
    # Mot de passe du compte administrateur créé au premier démarrage sur la
    # base locale de développement.
    # Ce n'est PAS un secret : valeur volontairement inutilisable ailleurs, sur
    # une base jetable, et jamais chargée en prod (le profil prod n'a pas de
    # valeur par défaut : sans GED_MDP_INITIAL, aucun compte n'est amorcé).
    # Un vrai mot de passe ici repartirait avec le dépôt et son historique.
    mot-de-passe-initial: ${GED_MDP_INITIAL:dev-local-only}

    # Compte unique en local : rattaché au premier employé de démonstration,
    # dont l'adresse dérivée est précisément celle-ci.
    email-admin: ${GED_EMAIL_ADMIN:sara.bennani@marchica.ma}
