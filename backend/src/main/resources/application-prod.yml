# ============================================================
#  Profil PROD — PostgreSQL 16+
#  Lancer avec : -Dspring.profiles.active=prod
#
#  Base (voir backend/.env.example et DEPLOIEMENT.md) :
#    DB_HOST, DB_PORT, DB_NAME          serveur et base
#    DB_USER / DB_PASSWORD              compte applicatif ged_app (DML seulement)
#    DB_OWNER_USER / DB_OWNER_PASSWORD  compte propriétaire ged_owner, utilisé
#                                       UNIQUEMENT par Liquibase au démarrage
#    DB_SCHEMA, DB_SCHEMA_LIQUIBASE     schémas (défauts : ged, ged_liquibase)
#  Rôles : backend/scripts/db/creer-roles.sql (une fois par serveur) ;
#  base, schémas et droits : backend/scripts/db/preparer-base.sql (par base).
#
#  SÉCURITÉ — obligatoires en prod, aucune valeur par défaut nulle part :
#    GED_LDAP_URLS, GED_LDAP_BASE, GED_LDAP_COMPTE_SERVICE,
#    GED_LDAP_MOT_DE_PASSE(_FICHIER), GED_LDAP_TRUSTSTORE(_MOT_DE_PASSE)
#                    annuaire LDAPS (ldap:// refusé au démarrage).
#    GED_JWT_KEYSTORE, GED_JWT_KEYSTORE_MOT_DE_PASSE, GED_JWT_ALIAS
#                    clé privée RSA de signature des jetons (RS256).
#                    Absente = refus de démarrer.
#    GED_ADMINISTRATEURS  sAMAccountName du ou des premiers administrateurs
#                    (rôle attribué à leur première connexion seulement).
#    GED_ORIGINES    origines CORS réelles du frontend.
#  Voir backend/.env.example.
# ============================================================
ged:
  base:
    nom: ${DB_NAME:ged}
    # Chiffrement ET vérification du certificat du serveur PostgreSQL (§6.2.1).
    sslmode: ${DB_SSLMODE:verify-full}

spring:
  datasource:
    hikari:
      data-source-properties:
        # Autorité qui a signé le certificat du serveur PostgreSQL (PKI MMED).
        sslrootcert: ${DB_SSLROOTCERT:/etc/ged/pki/postgresql-ca.crt}
  liquibase:
    # En uat et en prod, les migrations sont appliquées par le script de
    # déploiement (liquibase validate puis update, compte ged_owner), jamais au
    # démarrage de l'application. SPRING_LIQUIBASE_ENABLED=true le rétablit.
    enabled: false
  jpa:
    show-sql: false
