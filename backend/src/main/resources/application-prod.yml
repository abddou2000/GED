# ============================================================
#  Profil PROD — base MySQL
#  Lancer avec : -Dspring.profiles.active=prod
#  Variables d'env attendues : DB_HOST, DB_PORT, DB_NAME, DB_USER, DB_PASSWORD
# ============================================================
spring:
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:ged}?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: ${DB_USER:root}
    password: ${DB_PASSWORD:}
  jpa:
    database-platform: org.hibernate.dialect.MySQLDialect
    hibernate:
      ddl-auto: validate    # en prod : le schéma est géré par migrations, pas auto-créé
    show-sql: false
  h2:
    console:
      enabled: false
