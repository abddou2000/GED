# ============================================================
#  Profil PROD — PostgreSQL 16+
#  Lancer avec : -Dspring.profiles.active=prod
#
#  Base (voir backend/.env.example et DEPLOIEMENT.md) :
#    DB_HOST, DB_PORT, DB_NAME          serveur et base
#    DB_USER / DB_PASSWORD              compte applicatif ged_app (DML seulement)
#    DB_OWNER_USER / DB_OWNER_PASSWORD  compte propriétaire ged_owner, utilisé
#                                       UNIQUEMENT par Liquibase au démarrage
#    DB_SCHEMA, DB_SCHEMA_LIQUIBASE     schémas (défauts : ged, ged_liquibase)
#  Rôles et schémas : backend/scripts/db/creer-roles.sql, à exécuter une fois.
#
#  SÉCURITÉ — obligatoires en prod, aucune valeur par défaut nulle part :
#    GED_JWT_CLE     clé de signature JWT (openssl rand -base64 48).
#                    Absente = refus de démarrer (ServiceJeton).
#    GED_ORIGINES    origines CORS réelles du frontend. Laisser le repli
#                    localhost en prod déclenche un WARN au démarrage.
#    GED_MDP_INITIAL mot de passe d'amorçage du compte administrateur. Absent =
#                    aucun compte créé (fail-closed), ce qui est le comportement
#                    attendu une fois le compte en place.
#    GED_EMAIL_ADMIN adresse du compte unique (l'administrateur). Absente =
#                    repli sur admin@<ged.securite.domaine-email>.
#    GED_NOM_ADMIN   nom affiché de l'employé créé pour porter ce compte si
#                    aucun employé existant ne correspond à l'adresse.
#  Voir backend/.env.example.
# ============================================================
ged:
  base:
    nom: ${DB_NAME:ged}

spring:
  jpa:
    show-sql: false
