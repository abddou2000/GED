  copieConservation: {description: "Statut de la copie de conservation produite.", exemple: VALIDE}
  dossierId: {description: "Identifiant du dossier.", exemple: "0192f0a6-4444-7d1e-9f20-3a4b5c6d7e8f"}
  dossierNom: {description: "Nom du dossier.", exemple: "Marchés 2026"}
  demandeurId: {description: "Identité GED qui a demandé le traitement.", exemple: "0192f0a6-1111-7d1e-9f20-3a4b5c6d7e8f"}
  archivisteUtilisateurId: {description: "Identité GED de l'archiviste.", exemple: "0192f0a6-1111-7d1e-9f20-3a4b5c6d7e8f"}
