# Paramètres de chemin et de requête, par nom.
parametres:
  echeanceDepassee: "Vrai : seuls les documents dont l'échéance de conservation est atteinte (filtre « échéance dépassée », §12.9)."
  objet: Objet du document (socle commun, §12.7).
  dateDocument: "Date du document (AAAA-MM-JJ) ; date de dépôt si absente."
  motif: Motif du verrou (500 caractères au plus).
  actif: Vrai pour réactiver le type de document, faux pour le désactiver (plus aucun dépôt).
  circuitId: Identifiant du circuit de validation.
  validateurId: Identifiant du validateur dans le circuit.
  typeId: Identifiant du type de document.
  id: Identifiant opaque (UUID) de l'objet.
  cleId: Identifiant de la clé d'API.
  documentId: Identifiant du document.
  versionId: Identifiant de la version.
  page: Numéro de page, à partir de 0.
  size: "Taille de page : 50 par défaut, plafonnée à 200 (DAT §5.3.2)."
  taille: "Taille de page (alias de size) : 50 par défaut, plafonnée à 200."
  search: Texte recherché dans les colonnes affichées de la liste.
  sortBy: Colonne de tri, parmi une liste blanche ; ignorée si elle n'y figure pas.
  sortDir: "Sens du tri : asc ou desc (défaut)."
  typeDocumentId: Identifiant du type de document.
  workspaceId: Identifiant de l'espace de travail.
  nomFichier: Nom du fichier à analyser quand le fichier lui-même n'est pas envoyé.
  name: Nom du document.
  expirationDate: "Date d'expiration du document (AAAA-MM-JJ)."
  etiquetteIds: Identifiants des étiquettes à poser.
  observation: Observation enregistrée avec la version.
  verrouille: Vrai pour verrouiller le document, faux pour le déverrouiller.
  jours: Nombre de jours de la série (30 par défaut).
  nonLues: Vrai pour ne lister que les notifications non lues.
  has_user: 1 pour ne lister que les employés qui ont un compte de connexion.
  format: "Format d'export : csv (défaut) ou json."
  du: Début de la période (ISO 8601 UTC, inclus).
  au: Fin de la période (ISO 8601 UTC, exclue).
  utilisateur: Identifiant de l'utilisateur acteur.
  application: Identifiant de l'application actrice (clé d'API).
  action: Code d'action d'audit (ex. DOCUMENT_DEPOSE).
  objetType: "Nature de l'objet (DOCUMENT, ESPACE…)."
  objetId: Identifiant de l'objet.
  resultat: "Résultat : SUCCES, REFUS ou ECHEC."
  confidentialite: "Niveau de confidentialité du document déposé (PUBLIC, PRIVE, CONFIDENTIEL) ; défaut : celui du type."
  noeudId: Identifiant du nœud (espace ou dossier).
  sujetId: Identifiant du sujet (identité, groupe ou application).
  sujetType: "Nature du sujet : UTILISATEUR, GROUPE ou APPLICATION."
  utilisateurId: Identifiant de l'identité GED.
  version: "Identifiant de la version à télécharger ; version courante par défaut."
  pourUtilisateur: "Identité dont on consulte les droits (identifiant d'annuaire ou UUID) : soi-même, l'utilisateur délégué, ou tout tiers avec la permission d'administration des droits."
  dossierId: Identifiant du dossier.
  limite: "Nombre maximal de traitements listés (50 par défaut)."
  original: "Vrai pour télécharger l'original plutôt que la copie de conservation (document archivé)."

# Corps sans schéma nommé (Map côté contrôleur), reconnus par la fin du chemin.
corps:
  /emplacement:
    description: "Déplacer le document vers un autre dossier (Déplacer sur le document, Déposer sur la destination)."
    exemple: {noeudId: 0192f0a6-4444-7d1e-9f20-3a4b5c6d7e8f}
  multiple-delete:
    description: Identifiants des objets à placer dans la corbeille.
    exemple: {ids: [0192f0a6-4444-7d1e-9f20-3a4b5c6d7e8f]}
  multiple-restore:
    description: Identifiants des objets à restaurer depuis la corbeille.
    exemple: {ids: [0192f0a6-4444-7d1e-9f20-3a4b5c6d7e8f]}
  /parent:
    description: "Nouvel espace parent ; parentId nul pour placer l'espace à la racine."
    exemple: {parentId: 0192f0a6-2222-7d1e-9f20-3a4b5c6d7e8f}
  /approve:
    description: Validation d'une étape ; motif facultatif.
    exemple: {motif: Conforme}
  /rattachements:
    description: "Rattacher le document à un nœud supplémentaire (Modifier sur le document, Déposer sur le nœud)."
    exemple: {noeudId: 0192f0a6-4444-7d1e-9f20-3a4b5c6d7e8f}
  /designes:
    description: Désigner une identité autorisée à voir le document confidentiel.
    exemple: {utilisateurId: 0192f0a6-1111-7d1e-9f20-3a4b5c6d7e8f}
  /purge:
    description: "Identifiants des documents à purger définitivement de la corbeille (§12.5)."
    exemple: {ids: [0192f0a6-9999-7d1e-9f20-3a4b5c6d7e8f]}
  /reject:
    description: Refus d'une étape ; le motif explique le refus.
    exemple: {motif: Pièces justificatives manquantes}
