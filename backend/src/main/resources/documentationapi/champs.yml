# ============================================================
#  Dictionnaire de la spécification OpenAPI (T-053, DAT §5.3)
#
#  Décrit champ par champ les charges utiles de l'API, SANS annotation dans
#  les contrôleurs et DTO des autres lots : EnrichissementOpenApi l'applique
#  à la spécification générée par springdoc.
#
#  - objets     : description de chaque schéma (charge utile) ;
#  - champs     : description et exemple d'un champ, par nom, valables pour
#                 tous les schémas qui portent ce nom ;
#  - surcharges : « Schema.champ », quand un même nom change de sens.
#
#  Un champ ajouté à un DTO sans entrée ici fait échouer
#  SpecificationOpenApiTest, qui affiche les lignes à compléter.
#  Conventions (DAT §5.3.2) : identifiants UUID opaques, dates ISO 8601 en UTC.
# ============================================================

objets:
  Ref: Référence courte vers un objet (identifiant et libellé affiché).
  WorkSpaceRequest: Création ou modification d'un espace de travail (nœud de l'arborescence).
  WorkSpaceResponse: Espace de travail, avec son propriétaire, son parent et son circuit de validation.
  TreeNode: Nœud de l'arborescence des espaces, avec ses enfants.
  StepRequest: Étape d'une règle de workflow (validateur désigné).
  StepResponse: Étape d'une règle de workflow.
  WorkflowRequest: "Création ou modification d'une règle de workflow. Utilisateur : permission GERER_REFERENTIELS. Application (D8) : pour le compte d'une personne (X-On-Behalf-Of) qui a GERER_REFERENTIELS, et avec l'opération WORKFLOW_PILOTAGE dans la portée de la clé sur chaque nœud où la règle s'applique et sur chaque périmètre de validateur par rôle (au moins un nœud pour une règle non rattachée) ; double identité au journal."
  WorkflowResponse: Règle de workflow et espaces qui l'utilisent.
  TypeDocumentRequest: Création ou modification d'un type de document.
  TypeDocumentResponse: Type de document, avec son espace et son plan d'indexation.
  PlanIndexationRequest: Création ou modification d'un plan d'indexation et de sa charte de nommage.
  PlanIndexationResponse: Plan d'indexation, avec un aperçu du nom composé.
  IndexRequest: Création ou modification d'un index (métadonnée typée).
  IndexResponse: Index (métadonnée typée) d'un plan d'indexation.
  Ligne: Valeur saisie pour un index d'un document.
  ValeurRequest: Enregistrement des valeurs d'index d'un document.
  ValeurResponse: Valeur d'index enregistrée sur un document.
  EtiquetteRequest: Création ou modification d'une étiquette.
  EtiquetteResponse: Étiquette (mot-clé coloré) applicable aux documents.
  DocumentRequest: Modification des métadonnées d'un document.
  DocumentResponse: Document, avec ses étiquettes et ses versions.
  Tag: Étiquette posée sur un document.
  Version: Version d'un document ; une seule est courante.
  ApplicationRequest: Création ou modification d'une application cliente de l'API (DAT §5.4).
  ApplicationResponse: Application cliente de l'API, avec ses clés (jamais leur secret).
  CleResponse: Clé d'API telle que l'expose le serveur ; ni le secret ni son empreinte.
  CleGenereeResponse: Clé d'API générée ; la valeur complète n'est renvoyée qu'une seule fois.
  GenerationRequest: Génération d'une clé d'API pour une application.
  ActivationRequest: Activation ou désactivation d'une application cliente.
  RevocationRequest: Révocation motivée d'une clé d'API.
  AccessGroupRequest: Création ou modification d'un groupe d'accès.
  AccessGroupResponse: Groupe d'accès, avec ses espaces et ses membres.
  NotificationResponse: Notification de l'utilisateur (DAT §12.9) ; trois familles de cas seulement.
  CompteurResponse: Nombre de notifications non lues (pastille).
  MarquageResponse: Résultat du marquage global des notifications.
  PreferenceRequest: Préférence de notification ; l'e-mail peut être désactivé.
  PreferenceResponse: Préférence de notification de l'utilisateur.
  ModuleResponse: "Module métier de l'environnement (DAT §9.3) : un module inactif ferme ses routes (404 MODULE_INACTIF) ; le socle est toujours actif."
  FiltreIndex: Critère de recherche sur un index.
  RechercheRequest: Recherche multicritère sur les index, filtrée par les droits de l'appelant.
  GroupeResponse: Groupe de résultats de recherche (index de groupage).
  ResultatResponse: Document trouvé par une recherche.
  CritereResponse: Critère de recherche généré depuis un index « indexé pour recherche ».
  ApercuResponse: Index déduits du nom d'un fichier avant dépôt ; rien n'est écrit.
  AnalyseResponse: Proposition d'indexation d'un document déposé ; rien n'est écrit.
  Proposition: Valeur proposée pour un index, avec le verdict du contrôle de type.
  DemandeConnexion: Identifiants de connexion.
  ReponseConnexion: Jeton de session délivré après une connexion réussie.
  Anomalie: Anomalie détectée par la vérification du journal d'audit.
  Rapport: Rapport de vérification de l'intégrité du journal d'audit (DAT §7.4.2).
  LigneAudit: Événement du journal d'audit (DAT §7.4.1).
  JsonNode: Objet JSON libre (valeurs avant ou après une modification).
  SignatureResponse: Étape de validation (signature) attendue ou rendue sur un document.
  Part: Répartition d'un indicateur par libellé.
  Overview: Indicateurs d'ensemble du tableau de bord.
  Point: Point d'une série temporelle.
  Etat: État d'activation d'un traitement.
  MotOcr: Mot reconnu par l'OCR, avec sa position dans la page.
  TexteExtrait: Texte extrait d'un document (couche texte ou OCR).
  EtatExtracteur: Moteur d'extraction de texte disponible.
  EmployeResponse: Employé (personne métier).
  ProfilResponse: Profil de l'utilisateur connecté.
  IdentiteResponse: Identité de l'appelant (lot E2), rôles et permissions pour le confort d'affichage.
  IdentiteAdmin: Identité GED dans la liste d'administration.
  SessionAdmin: Session ouverte d'une identité.
  Revocation: Résultat de la fermeture des sessions d'une identité.
  DemandeHabilitation: Nouvelle attribution (rôle sur un nœud, un document ou en portée globale).
  HabilitationVue: Attribution telle que l'écran d'administration l'affiche.
  RoleVue: Rôle et ses permissions.
  PermissionVue: Permission livrée par le modèle de droits.
  DemandeRole: Création ou recomposition d'un rôle.
  DroitsEffectifs: Droits effectifs d'un sujet sur une cible, avec leur origine (§12.2.3).
  EmplacementVue: Emplacement d'un document et permissions qui s'y appliquent.
  OrigineVue: Origine d'une permission effective (attribution, héritage, portée globale…).
  ConfidentialiteVue: Décision de confidentialité sur un document.
  PorteeCleRequest: Portée complète d'une clé d'API, remplacée d'un bloc (§5.4).
  PorteeRequest: Nœud (sous-arborescence comprise) et opérations permises à la clé.
  PorteeResponse: Ligne de portée d'une clé d'API.
  Conservation: État de conservation d'un document et de la copie PDF/A de sa version courante (§6.1.4, §12.6).
  Info: Copie de conservation PDF/A d'une version.
  Resultat: Issue de l'archivage d'un document.
  Job: Archivage d'un dossier en traitement de fond, avec sa progression.
  Element: Ligne du rapport d'archivage d'un dossier.
  Export: Export ZIP d'un dossier en traitement de fond (§12.10).
  Texte: Texte extrait de la version courante d'un document et état de l'OCR (§4.3.4).
  DossierRequest: Création d'un dossier dans un espace ou un dossier parent (contrat §5.3.1).
  RechercheContratRequest: "Recherche multicritère et/ou plein texte, filtrée à la source par les droits de l'appelant (contrat §5.3.1)."
  PageResultats: Page de résultats de recherche ; le total est calculé sur le seul périmètre autorisé.
  PageResultatsResultat: Document trouvé, avec son extrait surligné (plein texte).
  ArchivageServiceResultat: Issue de l'archivage d'un document.
  Segment: Morceau d'extrait ; à afficher comme du texte, surligné s'il correspond à la recherche.
  # --- Modèle (E7) et workflow de validation (E8), dev1 ----------------------
  Critere: Critère de recherche sur une métadonnée du plan (valeur, ou bornes pour une date ou un nombre).
  Requete: Recherche de documents par métadonnées (§12.7), date du document en tri prioritaire.
  Demande: Re-typologisation de documents vers un autre type (correspondance des champs, §12.7).
  JobRetypage: Travail de re-typologisation en traitement de fond, avec son rapport par document.
  LienRepris: Ancien lien groupe / espace consigné par la reprise, sans droit associé.
  CircuitResponse: Circuit de validation d'un document, validateurs parallèles et décisions (§12.8).
  Validateur: Validateur d'un circuit, nommé ou par rôle, avec son état sur la version courante.
  DecisionVue: Décision rendue dans un circuit, jamais modifiée.
  DemandeDecision: Décision d'un validateur (VALIDE, REFUSE avec motif, ANNULEE).
  DemandeMotif: Motif d'une annulation de circuit.
  DemandeReaffectation: Réaffectation d'un validateur défaillant par l'Administrateur.
  DemandeDiffusion: Diffusion d'un document validé à des personnes et à des groupes, sans copie.
  ResultatDiffusion: Résultat d'une diffusion.
  DemandeRattachement: Rattachement d'une règle de workflow à un nœud ou à un type ; nul pour détacher.
  RegleDocument: Règle de workflow qui s'appliquerait au document, et son origine.
  ATraiter: Validation attendue de l'acteur.
  DecisionRendue: Décision rendue par l'acteur (historique).
  VuesWorkflowAnomalie: Validateur qui ne peut pas décider (tableau de bord de l'Administrateur).

champs:
  # --- Envoi multipart -------------------------------------------------------
  file: {description: "Fichier envoyé (multipart/form-data) ; type réel, taille et antivirus contrôlés.", exemple: null}

  # --- Stockage, OCR et cycle de vie (lots E5 à E7, dev3) -------------------
  deposeDu: {description: "Date de dépôt minimale (incluse, AAAA-MM-JJ).", exemple: "2026-01-01"}
  deposeAu: {description: "Date de dépôt maximale (incluse, AAAA-MM-JJ).", exemple: "2026-12-31"}
  taille: {description: "Taille de page : 50 par défaut, plafonnée à 200.", exemple: 50}
  tri: {description: "Tri en liste blanche : PERTINENCE (défaut avec texte), DATE_DEPOT (défaut sans texte), NOM, TYPE, INDEXATION_RECENTE.", exemple: PERTINENCE}
  pertinence: {description: "Score de pertinence plein texte (0 sans texte).", exemple: 0.42}
  deposeLe: {description: "Date de dépôt du document.", exemple: "2026-09-27T09:30:00Z"}
  espace: {description: "Nom de l'espace (emplacement principal) du document.", exemple: "Marchés"}
  extrait: {description: "Extrait du texte en segments (jamais de HTML).", exemple: null}
  resultats: {description: "Résultats de la page.", exemple: null}
  surligne: {description: "Vrai si le segment correspond à la recherche.", exemple: true}

  metadonnees: {description: "Métadonnées du dépôt en un seul appel : objet JSON {CODE_INDEX: valeur} (64 Ko au plus).", exemple: "{\"NUM_MARCHE\":\"2026-014\"}"}
  statutOcr: {description: "État OCR de la version courante : EN_ATTENTE_OCR, EN_COURS_OCR, OCR_TERMINE ou OCR_ECHEC ; nul si sans objet.", exemple: OCR_TERMINE}
  statutIndexation: {description: "Issue de l'indexation (§12.11) : INDEXE, SANS_PLAN ou A_INDEXER.", exemple: INDEXE}
  motifIndexation: {description: "Pourquoi l'indexation du dépôt n'a pas abouti ; nul sinon.", exemple: "Index NUM_MARCHE obligatoire manquant"}
  # --- Source et canal du dépôt (T-040, §5.1, dev3) ------------------------
  canalDepot: {description: "Canal du dépôt : INTERFACE, API, BUREAU_ORDRE ou REPRISE.", exemple: INTERFACE}
  deposantUtilisateurId: {description: "Identité GED du déposant : utilisateur de l'interface ou personne déléguée par l'application (X-On-Behalf-Of).", exemple: "0192f0a6-1111-7d1e-9f20-3a4b5c6d7e8f"}
  depotDelegue: {description: "Vrai si une application a déposé pour le compte d'une personne (§5.5).", exemple: false}
  canal: {description: "Canal du dépôt (INTERFACE, API, BUREAU_ORDRE, REPRISE) ; tous si absent.", exemple: BUREAU_ORDRE}
  statutConservation: {description: "ACTIF ou ARCHIVE (§12.6) : un document archivé est en lecture seule.", exemple: ACTIF}
  archiveLe: {description: "Date d'archivage ; nulle pour un document actif.", exemple: "2026-09-30T08:00:00Z"}
  archivePar: {description: "Identité GED qui a archivé.", exemple: "0192f0a6-1111-7d1e-9f20-3a4b5c6d7e8f"}
  versionId: {description: "Identifiant de la version.", exemple: "0192f0a6-dddd-7d1e-9f20-3a4b5c6d7e8f"}
  copie: {description: "Copie de conservation PDF/A de la version courante, si elle existe.", exemple: null}
