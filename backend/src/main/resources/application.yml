# ============================================================
#  Configuration commune GED — profil actif : dev par défaut
#  Profils : dev (base ged_dev1), test (base <DB_NAME>_test), prod.
#  SGBD : PostgreSQL 16+ dans TOUS les profils (dossier technique §2.2, §4.1).
# ============================================================
spring:
  application:
    name: ged
  profiles:
    active: dev
  servlet:
    multipart:
      # Taille max des fichiers téléversés (documents GED)
      max-file-size: 100MB
      max-request-size: 120MB

  # ------------------------------------------------------------
  # Connexion applicative : compte ged_app (DML seulement, §4.2.3).
  # Le nom de base vient du profil (ged.base.nom) ; tout le reste est
  # surchargeable par variables d'environnement, voir backend/.env.example.
  # ------------------------------------------------------------
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${ged.base.nom}?currentSchema=${DB_SCHEMA:ged}
    username: ${DB_USER:ged_app}
    password: ${DB_PASSWORD:}

  # ------------------------------------------------------------
  # Migrations : Liquibase, SEULE source du schéma (§4.2.1).
  # Il se connecte avec le compte propriétaire ged_owner — jamais celui de
  # l'application, qui n'a aucun droit DDL. Même URL que la datasource.
  # ------------------------------------------------------------
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.xml
    user: ${DB_OWNER_USER:ged_owner}
    password: ${DB_OWNER_PASSWORD:}
    default-schema: ${DB_SCHEMA:ged}
    # Registre des migrations dans un schéma à part, hors de portée de ged_app.
    liquibase-schema: ${DB_SCHEMA_LIQUIBASE:ged_liquibase}

  jpa:
    hibernate:
      # Hibernate ne crée ni ne modifie jamais le schéma : il vérifie que les
      # entités correspondent à ce que Liquibase a produit, et refuse de
      # démarrer sinon. Identique dans tous les profils.
      ddl-auto: validate
    properties:
      hibernate:
        # Horodatages écrits et relus en UTC (timestamptz), quel que soit le
        # fuseau du serveur d'application.
        jdbc:
          time_zone: UTC

server:
  port: 8080

# ============================================================
#  Securite : authentification par jeton JWT
# ============================================================
ged:
  securite:
    jwt:
      # Cle de signature HMAC-SHA256. 32 octets MINIMUM.
      #
      # AUCUNE VALEUR PAR DEFAUT ICI, VOLONTAIREMENT. Une cle ecrite dans un
      # fichier versionne est publique des que le depot circule (et le reste
      # dans l'historique) : elle permet de FORGER un jeton administrateur sans
      # connaitre aucun mot de passe. Voir backend/.env.example.
      #
      #   - profil prod : GED_JWT_CLE obligatoire, sinon le demarrage echoue.
      #   - hors prod   : une cle aleatoire est tiree au demarrage (jetons
      #                   invalides apres chaque redemarrage, WARN au log).
      cle: ${GED_JWT_CLE:}
      # Duree de vie du jeton. Courte a dessein : le jeton vit cote navigateur,
      # une fuite ne doit pas donner un acces indefini. Cette valeur sert aussi
      # de BORNE HAUTE a la verification : un jeton dont exp-iat depasse cette
      # duree est refuse, meme correctement signe.
      validite-minutes: 120
      # Emetteur pose a l'emission et exige a la verification.
      emetteur: ged-api
      # Derive d'horloge toleree entre le serveur et l'emetteur, en secondes.
      tolerance-horloge-secondes: 60

    # Domaine utilise pour deriver l'adresse d'un employe (prenom.nom@domaine).
    # Sert a rattacher le compte administrateur a l'employe correspondant.
    domaine-email: marchica.ma

    # Adresse du COMPTE UNIQUE (l'administrateur). L'application n'a qu'un
    # utilisateur : c'est la seule adresse amorcee au premier demarrage.
    # Vide = repli sur admin@<domaine-email>.
    email-admin: ${GED_EMAIL_ADMIN:}

    # Nom affiche de l'employe cree pour porter le compte administrateur, si
    # aucun employe existant ne correspond a l'adresse ci-dessus.
    nom-admin: ${GED_NOM_ADMIN:Administrateur GED}

    # Mot de passe pose sur le compte AMORCE au premier demarrage.
    # Vide = aucun compte cree (comportement par defaut, fail-closed).
    # Meme regle que la cle JWT : jamais de secret par defaut ici. Le profil dev
    # fixe une valeur locale explicitement jetable (voir application-dev.yml).
    mot-de-passe-initial: ${GED_MDP_INITIAL:}

    # Freinage des tentatives de connexion ratees, par e-mail vise.
    tentatives-max: 8
    blocage-minutes: 10

    # Origines autorisees a appeler l'API (CORS), separees par des virgules.
    origines: ${GED_ORIGINES:http://localhost:*,http://127.0.0.1:*}

# Emplacement de stockage des fichiers de la GED
  storage:
    root: ./storage/ged        # dossier racine des documents
    temp: ./storage/temp       # pages rendues en image avant OCR, purgées après lecture

  # Chaîne d'OCRisation. Étage 1 (couche texte des PDF natifs) : toujours actif,
  # aucune installation requise. Étage 2 (Tesseract) : utilisé seulement si le
  # binaire répond, sinon simplement ignoré.
  ocr:
    enabled: true
    commande: C:/Program Files/Tesseract-OCR/tesseract.exe
    tessdata: ./tessdata       # modèles LSTM livrés avec l'application
    langue: fra+eng
    oem: 1                     # 1 = moteur LSTM seul, le plus précis
    psm: 3                     # 3 = page entière, segmentation automatique
    dpi: 300                   # rendu des pages PDF avant reconnaissance
    pages-max: 5               # bride le coût sur les documents volumineux

springdoc:
  swagger-ui:
    path: /swagger-ui.html

# ---------------------------------------------------------------
# Sonde de vie
# ---------------------------------------------------------------
# On n'expose QUE `health`, et sans son detail : les autres points de
# l'actuator (env, beans, mappings, heapdump) racontent l'interieur de
# l'application a qui sait demander. Une supervision n'a besoin que de
# savoir si le service repond.
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
