# ============================================================
#  Configuration commune GED — profil actif : dev par défaut
#  Profils : dev (base ged_dev1), test (base <DB_NAME>_test), prod.
#  SGBD : PostgreSQL 16+ dans TOUS les profils (dossier technique §2.2, §4.1).
# ============================================================
spring:
  application:
    name: ged
  # Journalisation, supervision et sondes : fichier dédié (DAT 6.7, 7.3).
  config:
    import: classpath:exploitation.yml,classpath:api.yml,classpath:notification.yml
  profiles:
    active: dev
  servlet:
    multipart:
      # Plafond de plateforme (§6.1.5) : 200 Mo par fichier, aligné sur
      # `client_max_body_size 210m` de NGINX (la requête porte aussi les champs
      # du formulaire). La taille par type documentaire (100 Mo par défaut) est
      # contrôlée ensuite par l'application ; ceci n'est que le plafond dur.
      max-file-size: 200MB
      max-request-size: 210MB

  # ------------------------------------------------------------
  # Connexion applicative : compte ged_app (DML seulement, §4.2.3).
  # Le nom de base vient du profil (ged.base.nom) ; tout le reste est
  # surchargeable par variables d'environnement, voir backend/.env.example.
  # ------------------------------------------------------------
  datasource:
    # sslmode : prefer en dev et test (PostgreSQL local) ; verify-full en uat et
    # prod (profil prod), où la connexion à la base est chiffrée ET le certificat
    # du serveur vérifié contre l'autorité de MMED (§6.2.1).
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${ged.base.nom}?currentSchema=${DB_SCHEMA:ged}&sslmode=${ged.base.sslmode}
    username: ${DB_USER:ged_app}
    password: ${DB_PASSWORD:}

  # ------------------------------------------------------------
  # Migrations : Liquibase, SEULE source du schéma (§4.2.1).
  # Il se connecte avec le compte propriétaire ged_owner — jamais celui de
  # l'application, qui n'a aucun droit DDL. Même URL que la datasource.
  # ------------------------------------------------------------
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.xml
    user: ${DB_OWNER_USER:ged_owner}
    password: ${DB_OWNER_PASSWORD:}
    default-schema: ${DB_SCHEMA:ged}
    # Registre des migrations dans un schéma à part, hors de portée de ged_app.
    liquibase-schema: ${DB_SCHEMA_LIQUIBASE:ged_liquibase}

  jpa:
    hibernate:
      # Hibernate ne crée ni ne modifie jamais le schéma : il vérifie que les
      # entités correspondent à ce que Liquibase a produit, et refuse de
      # démarrer sinon. Identique dans tous les profils.
      ddl-auto: validate
    properties:
      hibernate:
        # Horodatages écrits et relus en UTC (timestamptz), quel que soit le
        # fuseau du serveur d'application.
        jdbc:
          time_zone: UTC

server:
  port: 8080

# ============================================================
#  Securite : authentification par jeton JWT
# ============================================================
ged:
  base:
    sslmode: ${DB_SSLMODE:prefer}

  securite:
    # Origines autorisees a appeler l'API (CORS), separees par des virgules.
    origines: ${GED_ORIGINES:http://localhost:*,http://127.0.0.1:*}

  # ------------------------------------------------------------
  #  Autorisation (lot E3, dossier technique §12.2.3)
  # ------------------------------------------------------------
  autorisation:
    cache:
      # Nombre de sujets dont les droits résolus restent en mémoire (le plus
      # ancien usage est évincé). Invalidation par le compteur
      # version_habilitations : aucune durée de vie à régler.
      taille: ${GED_AUTORISATION_CACHE_TAILLE:1000}

  # ------------------------------------------------------------
  #  Identité et sessions (lot E2, dossier technique §3 ; décisions D1 à D4)
  #  Valeurs par défaut = PRODUCTION, fermées : LDAPS exigé, clé JWT fournie
  #  exigée, cookie Secure. Voir backend/.env.example et DEPLOIEMENT.md.
  # ------------------------------------------------------------
  identite:
    annuaire:
      # Contrôleurs de domaine, par ordre de préférence, séparés par des
      # virgules (D4 : N contrôleurs, un seul suffit). ldaps:// obligatoire.
      urls: ${GED_LDAP_URLS:}
      base: ${GED_LDAP_BASE:}
      # Compte de service en lecture seule (DN) et son secret : variable
      # d'environnement, ou fichier relu à chaud (rotation sans redémarrage).
      compte-service: ${GED_LDAP_COMPTE_SERVICE:}
      mot-de-passe-service: ${GED_LDAP_MOT_DE_PASSE:}
      mot-de-passe-service-fichier: ${GED_LDAP_MOT_DE_PASSE_FICHIER:}
      delai-connexion: 3s
      delai-lecture: 5s
      pool: true
      exiger-ldaps: true
      # Chaîne de certificats de MMED (magasin de confiance propre à l'annuaire).
      truststore: ${GED_LDAP_TRUSTSTORE:}
      truststore-mot-de-passe: ${GED_LDAP_TRUSTSTORE_MOT_DE_PASSE:}
      truststore-type: ${GED_LDAP_TRUSTSTORE_TYPE:PKCS12}
      # Strict minimum (D3). memberOf, groupes, unités et userAccountControl
      # sont refusés par le code même s'ils sont ajoutés ici (P2, D1).
      attributs: sAMAccountName,objectGUID,givenName,sn,displayName,mail,department
    jeton:
      validite: 15m
      emetteur: ged-api
      tolerance-horloge: 30s
      # Magasin PKCS#12 de la clé privée RSA de signature (RS256), hors dépôt.
      keystore: ${GED_JWT_KEYSTORE:}
      keystore-mot-de-passe: ${GED_JWT_KEYSTORE_MOT_DE_PASSE:}
      alias: ${GED_JWT_ALIAS:ged-jwt}
      cle-ephemere-autorisee: false
    session:
      # 8 h au dossier V3 ; 4 h recommandées (risque R26). Format ISO-8601 ou 8h.
      duree-absolue: ${GED_SESSION_DUREE_ABSOLUE:8h}
      inactivite: 30m
      nom-cookie: ged_renouvellement
      chemin-cookie: /api/v1/auth
      cookie-securise: true
      entete-csrf: X-GED-Renouvellement
    limitation:
      tentatives: 5
      fenetre: 1m
    cache:
      duree: 15m
    amorcage:
      # sAMAccountName recevant le rôle Administrateur à leur PREMIÈRE connexion.
      administrateurs: ${GED_ADMINISTRATEURS:}
    # Rapprochement d'une identité avec une fiche employé reprise (prenom.nom@domaine).
    domaine-courriel: ${GED_DOMAINE_COURRIEL:marchica.ma}

  # ------------------------------------------------------------
  #  Stockage sécurisé des fichiers (lot E5, §6.1)
  # ------------------------------------------------------------
  fichiers:
    # Référentiel chiffré : /<racine>/aa/bb/<uuid>.enc (écriture unique et atomique)
    racine: ${GED_STOCKAGE_RACINE:./storage/coffre}
    # Cache chiffré des aperçus bureautiques convertis en PDF
    racine-cache-apercu: ${GED_CACHE_APERCU_RACINE:./storage/cache-apercu}
    taille-max-defaut-mo: 100       # par type documentaire, si le type n'en fixe pas
    plafond-plateforme-mo: 200      # = spring.servlet.multipart.max-file-size = NGINX
    formats-par-defaut: pdf,tiff,jpeg,png,txt,csv,docx,xlsx,pptx,odt,ods,odp
    cles:
      # Keystore PKCS#12 des clés maîtresses (KEK). HORS du référentiel de
      # fichiers, distinct pour DEV, UAT et PROD. Aucune valeur par défaut ici :
      # voir backend/.env.example.
      keystore: ${GED_KEYSTORE_CHEMIN:}
      mot-de-passe: ${GED_KEYSTORE_MDP:}
      creer-si-absent: false         # vrai seulement en dev et en test
      rotation-planifiee: false      # rotation annuelle automatique de la KEK
      rotation-cron: "0 0 2 1 1 *"
    antivirus:
      actif: true                    # échec fermé : ClamAV absent = dépôt refusé
      hote: ${GED_CLAMAV_HOTE:localhost}
      port: ${GED_CLAMAV_PORT:3310}
      delai-connexion-ms: 2000
      delai-lecture-ms: 120000
      taille-bloc-octets: 65536
    integrite:
      verification-planifiee: true   # toutes les versions chiffrées, mensuellement
      cron: "0 0 3 1 * *"            # le 1er de chaque mois à 3 h
    previsualisation:
      api-active: true               # GET /api/v1/versions/{id}/apercu
      libreoffice-commande: ${GED_LIBREOFFICE:soffice}
      delai-conversion-s: 120
      # tmpfs en production : la conversion y dépose une copie en clair éphémère
      repertoire-travail: ${GED_APERCU_TRAVAIL:${java.io.tmpdir}/ged-apercu}

  # ------------------------------------------------------------
  #  OCR asynchrone et recherche plein texte (lot E6, §4.3, §4.4)
  # ------------------------------------------------------------
  # Le texte extrait n'alimente AUCUN champ d'index (§4.3.3) : il ne sert qu'à
  # la recherche plein texte.
  ocr:
    # Binaire Tesseract 5 (appelé depuis Java, décision D5) et modèles fra/ara.
    commande: ${GED_TESSERACT:C:/Program Files/Tesseract-OCR/tesseract.exe}
    tessdata: ${GED_TESSDATA:./tessdata}
    oem: 1                     # 1 = moteur LSTM seul, le plus précis
    psm: 3                     # 3 = page entière, segmentation automatique
    chaine:
      actif: true                      # enfilage au dépôt (HTTP 202), workers, API recherche et supervision
      workers: 2                       # workers OCR de cette instance
      scrutation: 5s
      bail: 10m                        # prolongé à chaque page
      delai-par-page: 60s
      delais-reprise: 1m,5m,30m        # 3 reprises, puis OCR_ECHEC
      dpi: 300
      seuil-caracteres-par-page: 25    # sous ce seuil, la page PDF passe à l'OCR
      objectif-disponibilite: ${ged.supervision.ocr.objectif-disponibilite:${GED_OCR_OBJECTIF_DISPONIBILITE:24h}}  # D6 ; même source que la supervision
      # ara+fra et non fra+ara : mêmes modèles, mais la première langue est la
      # langue principale de Tesseract (la seconde n'est essayée que sur les mots
      # peu sûrs). Mesuré (docs/exploitation/ESSAIS-DE-CHARGE.md § 2) : CER arabe
      # 10,3 -> 5,1 %, bilingue 10,4 -> 8,9 %, français inchangé (0,18 %), +4 % de temps.
      langue-defaut: ${GED_OCR_LANGUE_DEFAUT:ara+fra}
      langues-par-type: {}             # ex. TD-FACT: fra (deux fois plus rapide sur un type tout en français)
      reindexation-lot: 500
      reindexation-pause: 200ms

  # ------------------------------------------------------------
  #  Cycle de vie (lot E7) : purge (§12.5), archivage et copie PDF/A-2
  #  (§12.6, §6.1.4, revue client D10), export de dossier (§12.10).
  #  Aucune purge ni aucun archivage automatique (P4, D10).
  # ------------------------------------------------------------
  cycledevie:
    travailleur:
      actif: true                    # jobs d'archivage de dossier et exports de fond
      intervalle: 5s
      bail: 15m                      # prolongé à chaque tranche ; au-delà, repris ailleurs
    archivage:
      tranche: 100                   # documents par transaction (§12.6)
      # tmpfs en production : la conversion PDF/A y dépose une copie en clair éphémère
      repertoire-travail: ${GED_CONSERVATION_TRAVAIL:${java.io.tmpdir}/ged-conservation}
    export:
      seuil-documents: 500           # au-delà : traitement de fond (§12.10)
      seuil-octets: 2147483648       # 2 Go
      retention: 7d                  # puis destruction de l'archive produite

  # ------------------------------------------------------------
  #  Alerte d'échéance de conservation (T-112, §12.9) : tâche quotidienne sous
  #  verrou de tâche (une seule instance l'exécute), notification aux Agents
  #  d'archive. Aucune suppression automatique (P4).
  # ------------------------------------------------------------
  conservation:
    alertes:
      actif: ${GED_ALERTE_ECHEANCE_ACTIVE:true}
      cron: "${GED_ALERTE_ECHEANCE_CRON:0 0 6 * * *}"   # chaque jour à 6 h, heure de MMED
      tranche: 200                   # documents signalés par transaction
      bail: 2h                       # durée maximale du verrou de tâche

springdoc:
  swagger-ui:
    path: /swagger-ui.html

# ---------------------------------------------------------------
# Sondes de santé et métriques : voir exploitation.yml (port de
# management séparé, réservé au réseau interne, DAT 6.7).
# ---------------------------------------------------------------
