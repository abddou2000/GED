# Modèles des notifications (DAT §12.9, dossier fonctionnel §4.6.6), en français.
# Fichier lu en UTF-8 par ModelesNotification.
#
# {variable}        : remplacée par la valeur fournie par le déclencheur, ou « — ».
# [[ ... ]]         : segment facultatif, omis entier si une variable qu'il
#                     contient est absente (ex. le motif d'une validation).
#
# Les textes sont figés dans la notification au moment de sa création.

# --- Circuit de validation --------------------------------------------------
CIRCUIT_OUVERT.titre=Validation demandée : {document}
CIRCUIT_OUVERT.message=Votre validation est demandée pour le document « {document} »[[, circuit ouvert par {auteur}]]. Vous pouvez valider ou refuser ce document dans la GED.

CIRCUIT_DECISION.titre=Décision rendue sur « {document} » : {decision}
CIRCUIT_DECISION.message=Décision rendue sur le document « {document} » : {decision}[[, par {auteur}]].[[ Motif : {motif}.]]

CIRCUIT_ANNULE.titre=Circuit de validation annulé : {document}
CIRCUIT_ANNULE.message=Le circuit de validation du document « {document} » a été annulé[[ par {auteur}]].[[ Motif : {motif}.]] Aucune décision n'est plus attendue de votre part.

# --- Accès à un espace (attribution seule, jamais le retrait) ---------------
ACCES_ESPACE_ATTRIBUE.titre=Accès attribué : {espace}
ACCES_ESPACE_ATTRIBUE.message=Un accès à l'espace « {espace} » vous a été attribué[[ (rôle : {role})]][[ par votre ajout au groupe « {groupe} »]][[ par {auteur}]].

# --- Fin de conservation ----------------------------------------------------
ECHEANCE_CONSERVATION.titre=Fin de conservation atteinte : {document}
ECHEANCE_CONSERVATION.message=La durée de conservation du document « {document} » est échue[[ depuis le {echeance}]]. Le document est à examiner ; aucune suppression n'est automatique.

# --- Libellés des décisions -------------------------------------------------
decision.VALIDE=validé
decision.REFUSE=refusé
decision.ANNULEE=validation annulée

# --- Habillage de l'e-mail --------------------------------------------------
courriel.lien=Ouvrir dans la GED : {url}
courriel.pied=Message automatique de la GED Marchica Med, merci de ne pas y répondre. Vous pouvez désactiver ces e-mails dans vos préférences de notification ; les notifications restent visibles dans l'application.
