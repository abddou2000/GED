# =====================================================================
#  GED Marchica Med — NGINX frontal (DAT 2.2, 6.2.1, 6.2.2, 10.1, 10.2)
#
#  Installation : copier dans /etc/nginx/conf.d/ged.conf (fichier inclus
#  dans le bloc http{} du nginx.conf standard), adapter les quatre valeurs
#  marquées « À ADAPTER », puis : nginx -t && systemctl reload nginx
#
#  Rôle : terminaison TLS avec le certificat de MMED, service du paquet
#  Angular compilé et de son config.json d'environnement, relais de /api/
#  vers le back-end (serveur Linux distinct, DAT 10.2), limitation de débit.
#  Le port de management du back-end (Actuator) n'est JAMAIS relayé.
#
#  Version NGINX visée : 1.20 ou plus (RHEL 9, Debian 12, Ubuntu 22.04).
# =====================================================================

# ---------------------------------------------------------------------
# Limitation de débit (DAT 6.2.2), en cohérence avec les règles applicatives :
#  - connexion : 5 essais par minute par IP et par identifiant (DAT 3.4.1),
#    appliqué précisément par le back-end ; NGINX pose un garde-fou par IP
#    un peu plus large pour ne pas gêner le renouvellement de session ;
#  - API par clé : 600 requêtes par minute par clé (DAT 5.4), soit 10/s ;
#    une requête sans X-API-Key a une clé vide et n'est pas comptée ici ;
#  - API par IP : protection générale contre l'inondation.
# Réponse 429, comme le back-end (DAT 5.3.2).
# ---------------------------------------------------------------------
limit_req_zone $binary_remote_addr zone=ged_auth:10m    rate=10r/m;
limit_req_zone $binary_remote_addr zone=ged_api_ip:20m  rate=30r/s;
limit_req_zone $http_x_api_key     zone=ged_api_cle:10m rate=10r/s;
limit_req_status 429;
limit_req_log_level warn;

# ---------------------------------------------------------------------
# Traçabilité de bout en bout (DAT 7.3) : si l'appelant n'envoie pas de
# traceparent W3C, NGINX en crée un à partir de $request_id (32 caractères
# hexadécimaux). Le même identifiant figure dans le journal d'accès NGINX
# et dans le traceId des journaux du back-end.
# ---------------------------------------------------------------------
map $request_id $ged_span_nginx {
    "~^(?<debut>[0-9a-f]{16})" $debut;
    default                   "0000000000000001";
}
map $http_traceparent $ged_traceparent {
    ""      "00-$request_id-$ged_span_nginx-01";
    default $http_traceparent;
}

log_format ged_acces '$remote_addr - [$time_local] "$request" $status $body_bytes_sent '
                     '$request_time "$http_user_agent" trace=$ged_traceparent';

# ---------------------------------------------------------------------
# Back-end Spring Boot (serveur Linux distinct de la base, DAT 10.2).
# ---------------------------------------------------------------------
upstream ged_backend {
    # À ADAPTER : adresse du serveur d'application (port HTTP de l'API).
    server ged-app.marchica.local:8080;
    keepalive 32;
}

# ---------------------------------------------------------------------
# HTTP : aucun contenu applicatif en clair, redirection systématique.
# ---------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    # À ADAPTER : nom DNS de la GED.
    server_name ged.marchica.ma;
    server_tokens off;

    # Renouvellement automatique du certificat (ACME), si la PKI de MMED le
    # permet (DAT 6.2.1). Sans effet sinon.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/acme;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ---------------------------------------------------------------------
# HTTPS
# ---------------------------------------------------------------------
server {
    # « http2 » sur la directive listen reste compris par toutes les versions
    # visées (la directive « http2 on; » n'existe qu'à partir de 1.25.1).
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name ged.marchica.ma;
    server_tokens off;

    # --- TLS (DAT 6.2.1) ----------------------------------------------
    # À ADAPTER : certificat émis par MMED, suivi de TOUTE sa chaîne
    # d'intermédiaires (fullchain), et sa clé privée (propriétaire root, 0600).
    ssl_certificate     /etc/nginx/tls/ged.fullchain.pem;
    ssl_certificate_key /etc/nginx/tls/ged.key;

    # TLS 1.0 et 1.1 désactivés : seuls TLS 1.2 et 1.3.
    ssl_protocols TLSv1.2 TLSv1.3;
    # Suites modernes seulement (AEAD, échange de clés à confidentialité
    # persistante) ; TLS 1.3 choisit ses suites lui-même, toutes modernes.
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_ecdh_curve X25519:prime256v1:secp384r1;
    ssl_session_cache shared:GED_TLS:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # Agrafage OCSP : à activer si la PKI de MMED publie un répondeur OCSP.
    # ssl_stapling on;
    # ssl_stapling_verify on;
    # ssl_trusted_certificate /etc/nginx/tls/ged.chaine.pem;
    # resolver <DNS interne de MMED> valid=300s;

    # --- En-têtes de sécurité (DAT 6.2.2, OWASP) -------------------------
    # « always » : posés aussi sur les réponses d'erreur (4xx, 5xx).
    # ATTENTION : NGINX n'hérite PAS des add_header d'un niveau supérieur
    # dans un bloc location qui déclare ses propres add_header. Aucun bloc
    # location ci-dessous n'en déclare : ne pas en ajouter sans recopier
    # toutes ces lignes.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "same-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    # CSP adaptée à Angular (DAT 6.2.2) :
    #  - script-src 'self' : aucun script en ligne. Le paquet est construit
    #    sans CSS critique en ligne (angular.json, inlineCritical: false), qui
    #    reposait sur un gestionnaire onload en ligne ;
    #  - style-src 'unsafe-inline' : Angular et Angular Material injectent
    #    les styles des composants à l'exécution, par balises <style> et
    #    attributs style ; sans script en ligne autorisé, le risque résiduel
    #    se limite à de l'injection de mise en forme ;
    #  - img-src/frame-src blob: : aperçu des documents déchiffrés servi par
    #    URL blob (DAT 6.1.6) ; connect-src 'self' : l'API est sur la même
    #    origine ; frame-ancestors 'none' : pas d'intégration dans un cadre.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; frame-src 'self' blob:; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; upgrade-insecure-requests" always;

    access_log /var/log/nginx/ged.access.log ged_acces;
    error_log  /var/log/nginx/ged.error.log warn;

    # --- Taille des dépôts (DAT 6.1.5) ------------------------------------
    # Plafond de plateforme de 200 Mo, aligné sur les limites multipart du
    # back-end ; la taille par type documentaire est contrôlée par l'API.
    client_max_body_size 200m;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain;

    # --- Paquet Angular (DAT 2.2) -----------------------------------------
    # À ADAPTER si besoin : contenu de frontend/dist/frontend/browser.
    root /opt/ged/front/courant;
    index index.html;

    # config.json d'ENVIRONNEMENT, hors du paquet compilé (DAT 10.1) : le
    # même paquet est promu de DEV à UAT puis PROD sans recompilation.
    # Absent, l'application basculerait en mode démonstration sans le dire :
    # le script de déploiement vérifie sa présence et son contenu.
    location = /assets/config.json {
        alias /etc/ged/front/config.json;
        expires -1;
    }

    # Page d'entrée : jamais en cache, pour qu'un déploiement soit vu tout de suite.
    location = /index.html {
        expires -1;
    }

    # Fichiers compilés, nommés par empreinte de contenu : cache long sans risque.
    location ~* \.(?:js|css|woff2?|ttf|svg|png|ico|webp)$ {
        expires 30d;
        try_files $uri =404;
    }

    # Routage Angular par ancre (/#/…) : aucune réécriture vers index.html
    # n'est nécessaire, un chemin inconnu est un vrai 404.
    location / {
        try_files $uri $uri/ =404;
    }

    # Fichiers cachés (.git, .env…) : jamais servis.
    location ~ /\. {
        return 404;
    }

    # L'Actuator n'est servi que sur le port de management interne ; on ferme
    # aussi la porte ici, par défense en profondeur.
    location ^~ /actuator {
        return 404;
    }

    # --- API (DAT 5, 6.2.2) ------------------------------------------------
    # Connexion et renouvellement de session : débit le plus serré.
    location ^~ /api/v1/auth/ {
        limit_req zone=ged_auth burst=5 nodelay;
        limit_req zone=ged_api_ip burst=60 nodelay;

        proxy_pass http://ged_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        # L'adresse du client REMPLACE tout X-Forwarded-For reçu : un client
        # ne peut pas faire écrire une adresse de son choix dans les journaux.
        # Le back-end ne croit cet en-tête que venant de ce serveur
        # (GED_PROXYS_DE_CONFIANCE).
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header traceparent $ged_traceparent;
        # Ces en-têtes sont posés ici : ceux du back-end feraient doublon.
        proxy_hide_header X-Frame-Options;
        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header Strict-Transport-Security;
    }

    location ^~ /api/ {
        limit_req zone=ged_api_ip burst=60 nodelay;
        limit_req zone=ged_api_cle burst=20 nodelay;

        proxy_pass http://ged_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header traceparent $ged_traceparent;
        proxy_hide_header X-Frame-Options;
        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header Strict-Transport-Security;

        # Dépôts : le corps est transmis au fil de l'eau au back-end au lieu
        # d'être mis en tampon sur le disque de NGINX — un document ne doit
        # exister en clair sur aucun disque intermédiaire (DAT 6.1).
        proxy_request_buffering off;
        # Dépôt de 200 Mo sur un lien lent, analyse antivirus comprise.
        client_body_timeout 300s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }
}
