# =====================================================================
#  Archivage continu des WAL (DAT 6.5) — SERVEUR DE BASE de la GED
#  À inclure dans postgresql.conf (include_dir 'conf.d') puis redémarrer
#  PostgreSQL (archive_mode ne se change qu'au redémarrage).
# =====================================================================
wal_level = replica
archive_mode = on
archive_command = '/opt/ged/deploiement/sauvegarde/archiver-wal.sh %p %f /mnt/sauvegarde-ged/wal'
# RPO de 15 minutes (DAT 6.5) : même sans activité suffisante pour remplir
# un segment de 16 Mo, un segment est archivé au plus tard toutes les 15 min.
archive_timeout = 900
# pg_basebackup depuis le serveur d'application.
max_wal_senders = 3
