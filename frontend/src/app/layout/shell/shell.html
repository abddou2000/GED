<div class="app-shell" [class.menu-open]="drawerOpen()">
  <!-- ===== Barre supérieure : marque + action + compte ===== -->
  <header class="topbar">
    <a routerLink="/accueil" class="topbar-brand" aria-label="Accueil GED">
      <app-brand-logo variant="onLight" [showWord]="true" [size]="30" />
    </a>

    <button class="hamburger" (click)="toggleDrawer()"
            [attr.aria-label]="drawerOpen() ? 'Fermer le menu' : 'Ouvrir le menu'" aria-haspopup="true">
      <mat-icon [svgIcon]="drawerOpen() ? 'close' : 'nav-index'"></mat-icon>
    </button>

    <span class="topbar-title">{{ pageTitle() }}</span>

    <div class="topbar-spacer"></div>

    <button class="acc-btn" [matMenuTriggerFor]="accMenu" aria-label="Compte utilisateur" aria-haspopup="menu">
      <span class="acc-av">{{ session.initials() }}</span>
      <span class="acc-name">{{ session.user()?.fullName || 'Utilisateur' }}</span>
      <mat-icon svgIcon="chevron-down"></mat-icon>
    </button>
    <mat-menu #accMenu="matMenu" xPosition="before">
      <div class="acc-head" (click)="$event.stopPropagation()">
        <div class="ah-name">{{ session.user()?.fullName || 'Utilisateur' }}</div>
        <div class="ah-mail">{{ session.user()?.email || '—' }}</div>
      </div>
      <button mat-menu-item disabled>
        <mat-icon svgIcon="user"></mat-icon><span>Mon profil</span>
      </button>
      <button mat-menu-item (click)="signOut()">
        <mat-icon svgIcon="close"></mat-icon><span>Se déconnecter</span>
      </button>
    </mat-menu>
  </header>

  <!-- ===== Menu horizontal ===== -->
  <nav class="topnav">
    <a routerLink="/accueil" routerLinkActive="active" (click)="closeDrawer()" aria-label="Accueil">
      <mat-icon svgIcon="home"></mat-icon><span>Accueil</span>
    </a>
    <a routerLink="/mes-workflow" routerLinkActive="active" (click)="closeDrawer()" aria-label="Mes workflow">
      <mat-icon svgIcon="nav-mesworkflow"></mat-icon><span>Mes workflow</span>
      @if (pendingCount() > 0) { <span class="nav-badge">{{ pendingCount() }}</span> }
    </a>
    <a routerLink="/espaces-de-travail" routerLinkActive="active" (click)="closeDrawer()" aria-label="Espaces de travail">
      <mat-icon svgIcon="nav-workspaces"></mat-icon><span>Espaces de travail</span>
    </a>
    <a routerLink="/televerser" routerLinkActive="active" (click)="closeDrawer()" aria-label="Documents déposés">
      <mat-icon svgIcon="nav-upload"></mat-icon><span>Documents</span>
    </a>
    <a routerLink="/recherche" routerLinkActive="active" (click)="closeDrawer()" aria-label="Rechercher un document">
      <mat-icon svgIcon="search"></mat-icon><span>Rechercher</span>
    </a>
    <a routerLink="/regles-de-workflow" routerLinkActive="active" (click)="closeDrawer()" aria-label="Règles de Workflow">
      <mat-icon svgIcon="nav-workflow"></mat-icon><span>Workflows</span>
    </a>
    <a routerLink="/groupe-d-acces" routerLinkActive="active" (click)="closeDrawer()" aria-label="Groupe d'accès">
      <mat-icon svgIcon="nav-groups"></mat-icon><span>Groupe d'accès</span>
    </a>
    <a routerLink="/index" routerLinkActive="active" (click)="closeDrawer()" aria-label="Index">
      <mat-icon svgIcon="nav-index"></mat-icon><span>Index</span>
    </a>
    <a routerLink="/plan-indexation" routerLinkActive="active" (click)="closeDrawer()" aria-label="Plan d'indexation">
      <mat-icon svgIcon="nav-plan"></mat-icon><span>Plan d'indexation</span>
    </a>
    <a routerLink="/type-de-document" routerLinkActive="active" (click)="closeDrawer()" aria-label="Type de document">
      <mat-icon svgIcon="nav-type"></mat-icon><span>Type de document</span>
    </a>
    <a routerLink="/etiquette" routerLinkActive="active" (click)="closeDrawer()" aria-label="Étiquette">
      <mat-icon svgIcon="nav-tag"></mat-icon><span>Étiquette</span>
    </a>
  </nav>

  <!-- ===== Contenu ===== -->
  <main class="main">
    <div class="content">
      <router-outlet />
    </div>
  </main>
</div>
