<div class="cd" [class.danger]="data.danger">
  <div class="cd-ic"><mat-icon [svgIcon]="icon()"></mat-icon></div>

  <h2 class="cd-title">{{ data.title }}</h2>
  @if (data.message) { <p class="cd-msg">{{ data.message }}</p> }

  @if (data.prompt) {
    <mat-form-field appearance="outline" class="cd-field">
      <mat-label>{{ data.promptLabel || 'Motif' }}</mat-label>
      <textarea matInput rows="3" [ngModel]="value()" (ngModelChange)="value.set($event)"
                [placeholder]="data.promptPlaceholder || ''" cdkFocusInitial></textarea>
    </mat-form-field>
    @if (touched() && invalid()) {
      <div class="cd-err">Ce champ est requis.</div>
    }
  }

  <div class="cd-actions">
    <button mat-stroked-button type="button" (click)="cancel()">{{ data.cancelLabel || 'Annuler' }}</button>
    <button mat-flat-button type="button" class="cd-confirm" [class.is-danger]="data.danger" (click)="accept()">
      {{ data.confirmLabel || 'Confirmer' }}
    </button>
  </div>
</div>
