<div class="confirm" [class.danger]="data.danger">
  <div class="ic">
    <mat-icon [svgIcon]="data.danger ? 'alert' : 'check'"></mat-icon>
  </div>
  <h2 mat-dialog-title>{{ data.title || 'Confirmation' }}</h2>
  <mat-dialog-content>{{ data.message }}</mat-dialog-content>
  <mat-dialog-actions align="end">
    <button mat-button type="button" (click)="cancel()">Annuler</button>
    <button mat-flat-button type="button" [class.danger-btn]="data.danger"
            [color]="data.danger ? undefined : 'primary'" (click)="confirm()">
      {{ data.confirmLabel || 'Confirmer' }}
    </button>
  </mat-dialog-actions>
</div>
